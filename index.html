<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f1f2f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palavras">
<title>Jogos de Palavras</title>
<style>
:root{
  color-scheme:light;
  --bg:#f1f2f5; --text:#1c1d21; --muted:#6a6e7a; --line:#d5d8e0; --card1:#ffffff; --card2:#eef0f4;
  --amber:#d9962b; --amber-bg:#fbeab9; --amber-line:#e7c874;
  --blue:#1d3f9a; --blue-bg:#dce7fb; --blue-line:#abc1ee;
  --info-bg:#f8efc9; --info-line:#e3d18f; --bad:#d93636; --ok:#2e9e57;
  --shadow:0 2px 6px rgba(20,24,40,.10),0 1px 1px rgba(20,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 0;user-select:none;-webkit-user-select:none}
body.mode-cw{padding-bottom:0}
h1{font-size:0;line-height:0;margin:0 0 6px}
.titleSvg{display:block;margin:0 auto;aspect-ratio:760/240;height:clamp(60px,11vh,92px);width:auto}
.homeArt{height:auto;width:clamp(250px,80vw,350px)}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:8px}
/* cartões e botões no estilo do WellDesigner */
.tab,.btn,select,.chip,.clues li,#cwClue,#board,#cwBoard{border:1px solid var(--line);box-shadow:var(--shadow)}
.tab{flex:1;padding:11px 4px;border-radius:14px;background:linear-gradient(var(--card1),var(--card2));color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
.tab.on{background:var(--amber-bg);border-color:var(--amber-line);box-shadow:inset 5px 0 0 var(--amber),var(--shadow);color:var(--text)}
.gtabs .tab{padding:13px 4px;font-size:15px}
.gtabs .tab.on{background:var(--blue-bg);border-color:var(--blue-line);box-shadow:inset 5px 0 0 var(--blue),var(--shadow);color:#12306f}
select,.btn{height:42px;border-radius:14px;background:linear-gradient(var(--card1),var(--card2));color:var(--text);font-size:14px;font-weight:600;padding:0 12px;cursor:pointer;touch-action:manipulation}
select{flex:1;min-width:0}
.btn{flex:1}
.btn.primary{background:#121316;border-color:#121316;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.btn:active,.tab:active,.key:active{transform:scale(.97)}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 4px}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
section{display:none;flex-direction:column;gap:10px}
section.on{display:flex}
.boardWrap{display:block;overflow:auto;padding:2px}
/* caça-palavras */
#board{margin:0 auto;width:max-content;display:grid;background:linear-gradient(var(--card1),var(--card2));border-radius:16px;padding:6px;touch-action:none;position:relative}
.cell{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text);border-radius:8px;transition:background .12s}
.cell.sel{background:#8fb3f1;color:#0f2760;box-shadow:inset 0 0 0 2px var(--blue)}
.cell.found{color:#14161c}
.cell.hint{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{background:var(--amber);color:#fff;transform:scale(1.15)}}
#words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:6px 12px;border-radius:999px;background:linear-gradient(var(--card1),var(--card2));font-size:13px;font-weight:700;letter-spacing:.4px}
.chip.done{text-decoration:line-through;color:#14161c}
/* palavras cruzadas */
#cwBoard{display:grid;gap:2px;padding:6px;background:linear-gradient(var(--card1),var(--card2));border-radius:16px;margin:0 auto;width:max-content}
.cw{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#fff;border:1px solid #c9ccd6;color:var(--text);font-weight:800;cursor:pointer}
.cw.blk{background:transparent;border-color:transparent;cursor:default}
.cw.w{background:var(--blue-bg);border-color:var(--blue-line)}
.cw.ok{background:#e1f4e7;border-color:#9fd3b0}
.cw.ok .l{color:#1f7a43}
.cw.bad{background:#fde4e4;border-color:#e59a9a}
.cw.flashok{animation:popok .4s}
.cw.flashbad{animation:shake .4s}
@keyframes popok{50%{transform:scale(1.18)}}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cw.s{background:#f7d77c;border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.cw.g .l{color:#6a6e7a}
.cw.g:not(.w):not(.s){background:#e6e8ee}
.cw.bad .l{color:var(--bad)}
.cw .l{line-height:1}
.cw .n{position:absolute;top:0;left:1px;line-height:1;font-weight:700;color:#5b6070;pointer-events:none}
#cwClue{display:flex;align-items:center;gap:8px;background:var(--info-bg);border-color:var(--info-line);border-radius:16px;padding:8px 10px;min-height:54px}
#cwClue .txt{flex:1;font-size:14px;line-height:1.25}
#cwClue .txt b{color:var(--amber)}
#cwClue button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--card1),var(--card2));color:var(--text);font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#cwMsg{min-height:18px;text-align:center;font-size:13px;color:var(--muted)}
.clues h3{margin:0 0 8px;font-size:14px;color:var(--text)}
.clues ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.25;padding:8px 10px;border-radius:14px;background:linear-gradient(var(--card1),var(--card2));cursor:pointer}
.clues li .no{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #c3c7d1;background:#f4f5f8;color:var(--text)}
.clues li.act{background:var(--amber-bg);border-color:var(--amber-line);box-shadow:inset 5px 0 0 var(--amber),var(--shadow)}
.clues li.act .no{background:var(--amber);border-color:var(--amber);color:#fff}
.clues li.ok .no{background:var(--ok);border-color:var(--ok);color:#fff}
.clues li.ok .tx{color:var(--muted)}
#kb{position:fixed;left:0;right:0;bottom:0;background:#e2e4ea;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;align-items:center;z-index:5;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(20,24,40,.08)}
body.mode-cw #kb{display:flex}
.krow{display:flex;gap:5px;width:100%;max-width:560px;justify-content:center}
.key{flex:1;max-width:44px;height:53px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(#fff,#eef0f4);color:var(--text);font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
.key.wide{flex:1.5;max-width:66px;background:linear-gradient(#e9ebf0,#d6d9e1)}
#overlay,#confirm{position:fixed;inset:0;background:rgba(20,24,40,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#overlay.show,#confirm.show{display:flex}
.modal{background:linear-gradient(#fff,#f1f2f6);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(20,24,40,.25)}
.modal h2{margin:0 0 8px;font-size:22px}
.modal p{margin:6px 0;color:var(--muted);font-size:15px}
.modal p b{color:var(--text)}
.modal .btn{margin-top:14px;width:100%;flex:none}
#home{display:none;position:fixed;inset:0;grid-template-rows:1fr auto 1fr;justify-items:center;padding:0 16px}
body.home #home{display:grid}
body.home h1,body.home .wrap{display:none}
body.home footer{position:fixed;left:0;right:0;bottom:0;padding:10px 0}
.homeHead{grid-row:1;align-self:end;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px}
.logo{width:clamp(110px,30vw,130px);height:auto;filter:drop-shadow(0 4px 8px rgba(29,63,154,.28))}
.homeTitle{text-align:center;line-height:0}
.homeBtns{grid-row:2;display:flex;flex-direction:column;gap:12px;width:100%;max-width:240px}
.homeBtn{height:50px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(var(--card1),var(--card2));box-shadow:inset 5px 0 0 var(--blue),var(--shadow);font-size:16px;font-weight:800;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;touch-action:manipulation;font-family:inherit}
.homeBtn span{font-size:19px}
.homeBtn:active{transform:scale(.98)}
footer{margin-top:auto;padding:16px 0 12px;font-size:12px;color:var(--muted);text-align:center}
body:not(.home) footer,body.mode-ws footer,body.mode-cw footer{display:none}   /* jogos: sem rodapé (versão aparece só na tela inicial) */
#cwClue{flex:1;min-width:0}
#cwReveal{flex:none;width:72px;padding:0;font-size:16px}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clueBox summary{list-style:none;cursor:pointer;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(var(--card1),var(--card2));box-shadow:var(--shadow);font-size:15px;font-weight:700}
.clueBox summary::-webkit-details-marker{display:none}
.clueBox summary::after{content:none}
.clueBox ul{display:none}   /* listas ficam ocultas: o botão só move o cursor (lista aberta gerava rolagem) */
@media(min-width:700px){
  .wrap{max-width:760px}
  .krow{max-width:760px}
  .key{max-width:56px;height:60px}
  .logo{width:150px}
  .homeBtns{max-width:300px}
  .homeBtn{height:58px;font-size:18px}
  body.mode-cw{padding-bottom:0}
}
@media(max-width:699px) and (max-height:700px){
  .key{height:46px}
  #kb{gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  body.mode-cw{padding-bottom:0}
}
@media(max-height:520px) and (orientation:landscape){
  #home{grid-template-columns:1fr 1fr;grid-template-rows:1fr;align-items:center;column-gap:20px}
  .homeHead{grid-row:1;grid-column:1;align-self:center;justify-self:end;margin-bottom:0;flex-direction:row;gap:14px}
  .logo{width:90px}
  .homeArt{width:230px}
  .homeBtns{grid-row:1;grid-column:2;justify-self:start;align-self:center}
  .homeArc{grid-row:1;grid-column:1/-1;justify-self:center;align-self:center;max-width:540px}
  #arcSets .arcGrid{grid-template-columns:repeat(11,1fr)}
  #arcSets .arcSet{height:40px}
  #modeBack,#arcBack{height:34px;width:200px;align-self:center;margin-top:0}
  #arcSets .arcGrid.g10 .arcSet{height:26px}
  #arcSets .arcGrid.g10 .arcSet small{display:none}
  body.home footer{padding:4px 0}
  h1{display:none}
  body{padding-top:8px}
  .wrap{gap:6px}
  .tab{padding:7px 4px;font-size:13px}
  .gtabs .tab{padding:8px 4px;font-size:14px}
  select,.btn,#cwClue button{height:34px}
  #cwClue button{width:34px}
  #cwClue{min-height:44px;padding:5px 8px}
  .stats{font-size:13px}
  .key{height:39px}
  #kb{gap:4px;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  body.mode-cw{padding-bottom:0}
}
[hidden]{display:none!important}
.arcLbl{text-align:center;font-weight:800;font-size:15px;padding:8px 10px;border-radius:14px;background:var(--amber-bg);border:1px solid var(--amber-line);box-shadow:var(--shadow)}
.homeTitle2{font-weight:800;font-size:17px;text-align:center;margin-bottom:4px}
.homeArc{grid-row:2;width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
#modeBack,#arcBack{flex:none;height:44px;width:100%;font-size:15px;margin-top:4px}
#arcSets .arcGrid.g10{grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0 6px}
#arcSets .arcGrid.g10 .arcSet{height:40px;border-radius:9px}
#arcSets .arcGrid.g10 .arcSet b{font-size:12px}
#arcSets .arcGrid.g10 .arcSet small{font-size:9px}
.foPager{align-items:center;gap:8px}.foPager .btn{flex:none;width:44px;height:36px;font-size:18px;padding:0}.foPg{flex:1;text-align:center;font-size:13px;color:var(--muted);font-weight:700}
#arcSets .row .tab{font-size:12px;padding:8px 2px}
#arcSets .arcGrid.g8{grid-template-columns:repeat(8,1fr)}
#arcSets .arcGrid.g8 .arcSet{height:42px}
body.arcv .homeHead{display:none}
.arcHead{font-weight:800;font-size:13px;color:var(--muted);margin-top:4px}
.arcGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:2px}
.arcSet{height:46px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(var(--card1),var(--card2));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0;font-family:inherit;color:var(--text);cursor:pointer;touch-action:manipulation}
.arcSet b{font-size:15px}
.arcSet small{font-size:11px;color:var(--muted)}
.arcSet:disabled{opacity:.4;cursor:default}
.arcSet:not(:disabled):active{transform:scale(.97)}
@media(min-width:700px){.homeArc{max-width:400px}}
#foSvg{height:min(400px,max(170px,calc(100vh - 430px)));width:auto;max-width:100%;display:block;margin:0 auto}
.fp{visibility:hidden}
.fp.on{visibility:visible}
.fe{visibility:hidden}
.fe.on{visibility:visible}
.foMain{display:flex;flex-direction:column;align-items:center;gap:8px}
.foClue{text-align:center;font-size:14px;line-height:1.3;padding:8px 12px;border-radius:14px;background:linear-gradient(var(--card1),var(--card2));border:1px solid var(--line);box-shadow:var(--shadow);width:100%;box-sizing:border-box}
.foWord{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:40px;margin:4px 0}
.fl{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:34px;padding:0 3px;border-bottom:3px solid var(--text);font-weight:800;font-size:20px}
.fl.miss{color:var(--bad)}
.foMsg{min-height:18px;text-align:center;font-size:13px;color:var(--muted)}
.key.off{opacity:.35;pointer-events:none}
</style>
</head>

const THEMES = {};
for (const k in RAW){
  const seen = new Set(), entries = [];
  RAW[k][1].split('\n').forEach(l=>{
    const i = l.indexOf('|'); if (i<0) return;
    const w = l.slice(0,i).trim(); let c = l.slice(i+1).trim(), t = 2;
    const j = c.lastIndexOf('|'); if (j>=0){t = +c.slice(j+1) || 2; c = c.slice(0,j).trim()}
    if (w && !seen.has(w)){seen.add(w);entries.push({w,c,t})}
  });
  THEMES[k] = {nome:RAW[k][0], entries, list:entries.map(e=>e.w)};
}

// Profundidade das palavras por nível: 1 = comum, 2 = intermediária, 3 = específica/técnica
const TIERW = {facil:{1:10,2:1.2,3:0.03}, medio:{1:1.2,2:6,3:1.5}, dificil:{1:0.08,2:2,3:10}, mix:{1:1,2:1,3:1}};
function tierOrder(entries, diff){
  const W = TIERW[diff];
  return entries.map(e=>({e, k:Math.pow(Math.random(), 1/W[e.t||2])}))
                .sort((a,b)=>b.k-a.k).map(o=>o.e);
}

function mkTimer(id){
  const t = {acc:0,t0:0,run:false,began:false,iv:null,
    sec(){return Math.floor((t.acc+(t.run?Date.now()-t.t0:0))/1000)},
    draw(){$(id).textContent = fmt(t.sec())},
    start(){if(t.run)return;t.run=true;t.began=true;t.t0=Date.now();t.iv=setInterval(t.draw,500)},
    pause(){if(!t.run)return;t.acc+=Date.now()-t.t0;t.run=false;clearInterval(t.iv);t.draw()},
    reset(){t.pause();t.acc=0;t.began=false;t.draw()}};

}

function tryPlace(grid, n, word, dirs){
  for (let t=0; t<300; t++){
    const [dx,dy] = dirs[rnd(dirs.length)];
    const x0 = rnd(n), y0 = rnd(n);
    const x1 = x0+dx*(word.length-1), y1 = y0+dy*(word.length-1);
    if (x1<0||x1>=n||y1<0||y1>=n) continue;
    let ok = true, newCells = 0;
    for (let i=0;i<word.length;i++){
      const c = grid[y0+dy*i][x0+dx*i];
      if (c && c!==word[i]) {ok=false;break}
      if (!c) newCells++;
    }
    if (!ok || newCells===0) continue;
    for (let i=0;i<word.length;i++) grid[y0+dy*i][x0+dx*i] = word[i];
    return {x:x0,y:y0,dx,dy};
  }
  return null;
}
function generateWS(opt){
  const d = opt || DIFFS[wsDiff], n = d.n, lvl = opt ? opt.diff : wsDiff;
  const pool = opt ? opt.pool : THEMES[wsTheme].entries.filter(e => e.t===DIFF_TIER[wsDiff] && e.w.length<=d.maxLen && e.w.length<=n && e.w.length>=3);
  for (let attempt=0; attempt<60; attempt++){
    const grid = Array.from({length:n},()=>Array(n).fill(''));
    const placed = [];
    for (const e of tierOrder(pool, lvl)){
      const w = e.w;
      if (placed.length>=d.count) break;
      if (placed.some(p => p.word.includes(w) || w.includes(p.word) || p.word.includes(rev(w)) || w.includes(rev(p.word)))) continue;
      const pos = tryPlace(grid, n, w, d.dirs);
      if (pos) placed.push({word:w, ...pos});
    }
    if (placed.length < d.count) continue;
    for (let y=0;y<n;y++) for (let x=0;x<n;x++) if(!grid[y][x]) grid[y][x] = FILL[rnd(FILL.length)];
    return {grid, placed, n};
  }
  return null;
}

function arcPool(tier, cap){   // palavras de todos os temas, sem repetir as já usadas no Arcade

function openFoSet(li,si){
  const st = foState(foScope), key = li+'-'+si, lst = foList(foScope);
  const fr = (i => i<0 ? lst.length : i)(lst.findIndex(([a,b]) => foProg(st,a,b) < FOARC_SET));
  if (lst.findIndex(p=>p[0]===li&&p[1]===si) > fr) return;
  const isRep = foProg(st,li,si) >= FOARC_SET;
  foCur = {li, si, key, isRep, gi: isRep ? (st.rg[key]||0) : foProg(st,li,si)};
  foArcWord(); openGame('fo');
}
function foArcNext(){   // próxima palavra do conjunto (ou tentar de novo, se errou)
  hideWin();
  if (fo && fo.done && fo.wrong>=FO_MAX){ foArcWord(); return }
  const st = foState(foScope), key = foCur.key;
  foCur.gi++;
  if (foCur.isRep) st.rg[key] = foCur.gi; else st.prog[key] = Math.max(foProg(st,foCur.li,foCur.si), foCur.gi);
  if (foCur.gi >= FOARC_SET){
    if (foCur.isRep) delete st.rg[key];
    foCur = null; saveFoarc(); goHome(); homeView('arcade'); return;
  }
  saveFoarc(); foArcWord();
}

function newWS(){

  ws = gameMode==='arcade' ? arcGen('ws') : gameMode==='aleatorio' ? aleGen('ws') : generateWS();
  if (!ws){ $('words').textContent='Não consegui gerar a grade. Toque em Novo jogo.'; $('board').innerHTML=''; return }
  wsShowBest(); wsRender(); wsSave();
}

let wsSel = null;
function wsCellAt(ev){
  const r = $('board').getBoundingClientRect(), n = ws.n, pad = 6;
  const cs = (r.width-pad*2)/n;
  const x = Math.floor((ev.clientX-r.left-pad)/cs), y = Math.floor((ev.clientY-r.top-pad)/cs);
  return [Math.max(0,Math.min(n-1,x)), Math.max(0,Math.min(n-1,y))];
}
function wsLine(sx,sy,cx,cy){
  const n = ws.n, ddx=cx-sx, ddy=cy-sy;
  if (!ddx && !ddy) return [[sx,sy]];
  const step = Math.round(Math.atan2(ddy,ddx)/(Math.PI/4));
  const dx = Math.round(Math.cos(step*Math.PI/4)), dy = Math.round(Math.sin(step*Math.PI/4));
  let len = Math.round((ddx*dx+ddy*dy)/(dx*dx+dy*dy));
  while (len>0 && (sx+dx*len<0||sx+dx*len>=n||sy+dy*len<0||sy+dy*len>=n)) len--;
  const out=[]; for(let i=0;i<=len;i++) out.push([sx+dx*i,sy+dy*i]);
  return out;
}
function wsPaintSel(){
  document.querySelectorAll('.cell.sel').forEach(c=>c.classList.remove('sel'));
  if (wsSel) wsSel.cells.forEach(([x,y])=>wsEls[y][x].classList.add('sel'));
}
const boardEl = $('board');
boardEl.addEventListener('pointerdown', ev=>{
  if (wsDone || !ws) return;
  ev.preventDefault(); boardEl.setPointerCapture(ev.pointerId);
  tWS.start();
  const [x,y] = wsCellAt(ev); wsSel = {sx:x,sy:y,cells:[[x,y]]}; wsPaintSel();
});
boardEl.addEventListener('pointermove', ev=>{
  if (!wsSel) return;
  const [x,y] = wsCellAt(ev); wsSel.cells = wsLine(wsSel.sx,wsSel.sy,x,y); wsPaintSel();
});
boardEl.addEventListener('pointerup', ()=>{
  if (!wsSel) return;
  const word = wsSel.cells.map(([x,y])=>ws.grid[y][x]).join('');
  const cells = wsSel.cells; wsSel = null; wsPaintSel();
  if (word.length<2) return;
  const idx = ws.placed.findIndex((p,i)=>!wsFound.has(i) && (p.word===word || p.word===rev(word)));
  if (idx>=0){
    wsFound.add(idx);
    const col = colorFor(idx);
    cells.forEach(([x,y])=>{const c=wsEls[y][x];c.classList.add('found');c.style.background=col});
    const chip = $('chip'+idx); chip.classList.add('done'); chip.style.background=col;
    wsStats(); wsSave();
    if (wsFound.size===ws.placed.length) wsWin();
  }
});
boardEl.addEventListener('pointercancel', ()=>{wsSel=null;wsPaintSel()});
const WS_MAX_HINTS = 3;
function wsHintLabel(){
  const left = Math.max(0, WS_MAX_HINTS-wsHints), b = $('hintBtn');
  b.textContent = `💡 Dica (${left})`; b.style.opacity = left<=0 ? .5 : 1;
}
$('hintBtn').onclick = () => {

  const rest = ws.placed.map((p,i)=>i).filter(i=>!wsFound.has(i));
  if (!rest.length) return;
  const p = ws.placed[rest[rnd(rest.length)]];

  const c = wsEls[p.y][p.x]; c.classList.remove('hint'); void c.offsetWidth; c.classList.add('hint');
  setTimeout(()=>c.classList.remove('hint'),1600);
};
function wsWin(){
  wsDone = true; tWS.pause(); wsSave(); const el = tWS.sec();
  const prev = +store(wsBest()) || 0; let rec = false;
  if (!prev || el<prev){store(wsBest(),String(el));rec=true}
  wsShowBest();

}

/* =====================================================================
   PALAVRAS CRUZADAS
   ===================================================================== */
function cwFit(g, m, N, word, x, y, dir){
  const dx = dir===0?1:0, dy = dir===1?1:0, L = word.length;
  const ex = x+dx*(L-1), ey = y+dy*(L-1);
  if (x<0||y<0||ex>=N||ey>=N) return -1;
  const bx = x-dx, by = y-dy, ax = ex+dx, ay = ey+dy;
  if (bx>=0&&by>=0&&g[by][bx]) return -1;
  if (ax<N&&ay<N&&g[ay][ax]) return -1;
  const bit = dir===0?1:2; let cross = 0;
  for (let i=0;i<L;i++){
    const cx = x+dx*i, cy = y+dy*i, ch = g[cy][cx];
    if (ch){
      if (ch!==word[i] || (m[cy][cx]&bit)) return -1;
      cross++;
    } else {
      const sx1 = cx+dy, sy1 = cy+dx, sx2 = cx-dy, sy2 = cy-dx;
      if (sx1<N&&sy1<N&&g[sy1][sx1]) return -1;
      if (sx2>=0&&sy2>=0&&g[sy2][sx2]) return -1;
    }
  }
  return cross;
}
function cwBuild(entries, N, target, diff){
  const g = Array.from({length:N},()=>Array(N).fill(''));
  const m = Array.from({length:N},()=>Array(N).fill(0));
  const placed = [], used = new Set();
  const WMAX = 14, HMAX = 16;   // limite de largura/altura do quadro na tela do celular
  let bx0=N,bx1=-1,by0=N,by1=-1;
  const put = (e,x,y,dir)=>{
    const dx = dir===0?1:0, dy = dir===1?1:0;
    for (let i=0;i<e.w.length;i++){g[y+dy*i][x+dx*i]=e.w[i]; m[y+dy*i][x+dx*i] |= dir===0?1:2}
    bx0=Math.min(bx0,x); by0=Math.min(by0,y); bx1=Math.max(bx1,x+dx*(e.w.length-1)); by1=Math.max(by1,y+dy*(e.w.length-1));
    placed.push({word:e.w,clue:e.c,x,y,dir}); used.add(e.w);
  };
  const order = tierOrder(entries, diff);
  const first = order[0];
  put(first, Math.floor((N-first.w.length)/2), Math.floor(N/2), 0);
  for (let pass=0; pass<3 && placed.length<target; pass++){
    for (const e of order){
      if (placed.length>=target) break;
      if (used.has(e.w)) continue;
      let best = [], bs = 0;
      for (const p of placed){
        for (let i=0;i<p.word.length;i++) for (let j=0;j<e.w.length;j++){
          if (p.word[i]!==e.w[j]) continue;
          const dir = 1-p.dir;
          const x = p.dir===0 ? p.x+i : p.x-j;
          const y = p.dir===0 ? p.y-j : p.y+i;
          // só bloqueia a posição que estouraria a largura/altura do quadro (vira vertical em vez disso)
          const L = e.w.length, ex = dir===0 ? x+L-1 : x, ey = dir===1 ? y+L-1 : y;
          if (Math.max(bx1,ex)-Math.min(bx0,x)+1 > WMAX || Math.max(by1,ey)-Math.min(by0,y)+1 > HMAX) continue;
          const s = cwFit(g,m,N,e.w,x,y,dir);
          if (s<1) continue;
          if (s>bs){bs=s;best=[[x,y,dir]]} else if (s===bs) best.push([x,y,dir]);
        }
      }
      if (best.length){const [x,y,dir]=best[rnd(best.length)]; put(e,x,y,dir)}
    }
  }
  return placed;
}
function generateCW(opt){
  const d = opt || DIFFS[cwDiff].cw, N = d.ws;
  const pool = opt ? opt.pool : THEMES[cwTheme].entries.filter(e=>e.t===DIFF_TIER[cwDiff] && e.w.length>=3 && e.w.length<=Math.min(d.maxLen,N));
  let best = null, bestScore = -1;
  for (let at=0; at<40; at++){
    const placed = cwBuild(pool, N, d.count, opt ? opt.diff : cwDiff);
    let x0=N,y0=N,x1=0,y1=0;
    placed.forEach(p=>{
      const ex = p.dir===0?p.x+p.word.length-1:p.x, ey = p.dir===1?p.y+p.word.length-1:p.y;
      x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,ex);y1=Math.max(y1,ey);
    });
    const W = x1-x0+1, H = y1-y0+1;
    const score = placed.length*1000 - W*H;     // mais palavras, depois grade mais compacta
    if (score>bestScore){bestScore=score;best={placed,x0,y0,W,H}}
    if (placed.length>=d.count && at>=6) break;
  }
  return best && cwModel(best);
}
function cwModel({placed,x0,y0,W,H}){
  const ch = Array.from({length:H},()=>Array(W).fill(''));
  const num = Array.from({length:H},()=>Array(W).fill(0));
  const cA = Array.from({length:H},()=>Array(W).fill(null));
  const cD = Array.from({length:H},()=>Array(W).fill(null));
  placed.forEach(p=>{p.x-=x0;p.y-=y0;
    for(let i=0;i<p.word.length;i++){const x=p.x+(p.dir===0?i:0),y=p.y+(p.dir===1?i:0);ch[y][x]=p.word[i]}});
  let n = 0; const across=[], down=[];
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    if (!ch[y][x]) continue;
    const sa = (x===0||!ch[y][x-1]) && x+1<W && ch[y][x+1];
    const sd = (y===0||!ch[y-1][x]) && y+1<H && ch[y+1][x];
    if (!sa && !sd) continue;
    n++; num[y][x]=n;
    for (const [dir,flag] of [[0,sa],[1,sd]]){
      if (!flag) continue;
      const p = placed.find(q=>q.x===x&&q.y===y&&q.dir===dir); if (!p) continue;
      const cells=[]; for(let i=0;i<p.word.length;i++) cells.push([x+(dir===0?i:0), y+(dir===1?i:0)]);
      const w = {num:n,dir,word:p.word,clue:p.clue,cells,x,y};
      cells.forEach(([cx,cy])=>{(dir===0?cA:cD)[cy][cx]=w});
      (dir===0?across:down).push(w);
    }
  }
  const user = Array.from({length:H},()=>Array(W).fill(''));
  const given = Array.from({length:H},()=>Array(W).fill(false));
  const bad = Array.from({length:H},()=>Array(W).fill(false));
  const ok = Array.from({length:H},()=>Array(W).fill(false));
  const ratio = DIFFS[cwDiff].cw.given;
  if (ratio>0){
    const all=[]; for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(ch[y][x]) all.push([x,y]);
    shuffle(all).slice(0,Math.round(all.length*ratio)).forEach(([x,y])=>{given[y][x]=true;user[y][x]=ch[y][x]});
  }
  return {W,H,ch,num,cA,cD,across,down,user,given,bad,ok,total:placed.length,placed,els:[]};
}
function cwBest(){return 'cw_best_'+cwDiff+'_'+cwTheme}
function cwShowBest(){const b=store(cwBest());$('cwBest').textContent = b? fmt(+b):'--'}
function cwCellSize(){
  const avail = Math.min(window.innerWidth-24, window.innerWidth>=700?760:560) - 16 - (cw.W-1)*2;
  const byW = Math.floor(avail/cw.W) - 2;   // -2: borda de cada casa
  // altura: o quadro cabe no espaço que sobra entre o topo, o teclado e o conteúdo de baixo (sem rolar a página)
  const wrap = document.querySelector('#cwPanel .boardWrap'), panel = $('cwPanel'), foot = document.querySelector('footer');
  const kbH = $('kb') ? $('kb').offsetHeight : 0;
  const topH = wrap.getBoundingClientRect().top;
  const belowH = panel.getBoundingClientRect().bottom - wrap.getBoundingClientRect().bottom;
  const footH = foot && foot.offsetParent ? foot.offsetHeight + 16 : 0;
  const room = window.innerHeight - kbH - topH - belowH - footH - 8;
  const byH = Math.floor((room - (cw.H-1)*2 - 16 - 2) / cw.H);
  return Math.max(12, Math.min(56, byW, byH));   // nunca passa da largura: sem barra horizontal
}
function cwRender(){
  const cs = cwCellSize(), b = $('cwBoard');
  const nfs = Math.max(6, Math.round(cs*.3)), lfs = Math.round(cs*.52);   // número pequeno no canto; letra no centro
  b.innerHTML=''; b.style.gridTemplateColumns=`repeat(${cw.W},${cs}px)`; b.style.gridAutoRows=cs+'px';
  cw.els = [];
  for (let y=0;y<cw.H;y++){
    const row=[];
    for (let x=0;x<cw.W;x++){
      const d = document.createElement('div');
      if (!cw.ch[y][x]) d.className='cw blk';
      else {
        d.className='cw';
        if (cw.num[y][x]){const n=document.createElement('span'); n.className='n'; n.style.fontSize=nfs+'px'; n.textContent=cw.num[y][x]; d.appendChild(n)}
        const l=document.createElement('span'); l.className='l'; l.style.fontSize=lfs+'px'; d.appendChild(l);
        d.addEventListener('click',()=>cwSelect(x,y));
      }
      b.appendChild(d); row.push(d);
    }
    cw.els.push(row);
  }
  const mk = (list,ul)=>{ul.innerHTML='';list.forEach(w=>{
    const li=document.createElement('li'); const no=document.createElement('span'); no.className='no'; no.textContent=w.num; const tx=document.createElement('span'); tx.className='tx'; tx.textContent=`${w.clue} (${w.word.length})`; li.append(no,tx);
    li.onclick=()=>{cwGoWord(w)}; w.li=li; ul.appendChild(li)})};
  mk(cw.across,$('cwAcross')); mk(cw.down,$('cwDown'));
  cwPaint();
}
function cwActive(){
  if (!sel) return null;
  return (sel.dir===0?cw.cA:cw.cD)[sel.y][sel.x];
}
function cwWordDone(w){return w.cells.every(([x,y])=>cw.user[y][x]===cw.ch[y][x])}
function cwPaint(){
  const aw = cwActive(); let filled = 0, total = 0;
  for (let y=0;y<cw.H;y++) for (let x=0;x<cw.W;x++){
    if (!cw.ch[y][x]) continue;
    total++; if (cw.user[y][x]) filled++;
    const d = cw.els[y][x];
    let c = 'cw';
    if (aw && aw.cells.some(([a,b])=>a===x&&b===y)) c+=' w';
    if (sel && sel.x===x && sel.y===y) c+=' s';
    if (cw.given[y][x]) c+=' g';
    if (cw.ok[y][x]) c+=' ok';
    if (cw.bad[y][x]) c+=' bad';
    d.className = c;
    d.querySelector('.l').textContent = cw.user[y][x];
  }
  $('cwFilled').textContent = filled+'/'+total;
  [...cw.across,...cw.down].forEach(w=>{
    w.li.classList.toggle('act', w===aw);
    w.li.classList.toggle('ok', cwWordDone(w));
  });
  cwSave(); cwHintLabel(); cwEnsureVisible();
  const t = $('cwClueTxt');
  if (aw) t.innerHTML = `<b>${aw.num} ${aw.dir===0?'➡':'⬇'}</b> ${aw.clue} <span style="color:var(--muted)">(${aw.word.length} letras)</span>`;
  else t.textContent = 'Toque em uma casa para começar';
}
function cwSelect(x,y){
  if (!cw.ch[y][x] || cwDone) return;
  // só palavras ainda não concluídas podem ser selecionadas
  const open = d => { const w=(d===0?cw.cA:cw.cD)[y][x]; return w && !cwWordDone(w) };
  if (!open(0) && !open(1)) return;
  tCW.start();
  if (sel && sel.x===x && sel.y===y){
    if (open(1-sel.dir)) sel.dir = 1-sel.dir;
  } else {
    let dir = sel?sel.dir:0;
    if (!open(dir)) dir = 1-dir;
    sel = {x,y,dir};
  }
  $('cwMsg').textContent=''; cwPaint();
}
function cwGoWord(w){
  if (cwWordDone(w)) return;
  const cell = w.cells.find(([x,y])=>!cw.user[y][x]) || w.cells[0];
  sel = {x:cell[0],y:cell[1],dir:w.dir}; tCW.start(); cwPaint();
  cw.els[cell[1]][cell[0]].scrollIntoView({block:'nearest',inline:'nearest'});
}
function cwStep(d){
  const all = [...cw.across,...cw.down]; if (!all.length) return;
  const aw = cwActive(); let i = aw?all.indexOf(aw):-1;
  for (let k=1;k<=all.length;k++){            // pula as palavras já concluídas
    const w = all[((i+d*k)%all.length+all.length)%all.length];
    if (!cwWordDone(w)){cwGoWord(w);return}
  }
}
function cwMove(step){
  const w = cwActive(); if (!w) return;
  const i = w.cells.findIndex(([x,y])=>x===sel.x&&y===sel.y), j = i+step;
  if (j>=0 && j<w.cells.length){sel.x=w.cells[j][0];sel.y=w.cells[j][1]}
}
const CW_MAX_HINTS = 3;
function cwEnsureVisible(){   // mantém a casa selecionada visível acima do teclado e abaixo da dica
  if (onHome || gameKey!=='cw' || !sel || !cw.els || !cw.els[sel.y]) return;
  const r = cw.els[sel.y][sel.x].getBoundingClientRect(), kb = $('kb').getBoundingClientRect();
  const bottomLimit = kb.top - 10, topLimit = document.querySelector('#cwPanel .stats').getBoundingClientRect().bottom + 8;
  if (r.bottom > bottomLimit) window.scrollBy(0, r.bottom - bottomLimit + 40);
  else if (r.top < topLimit) window.scrollBy(0, r.top - topLimit - 40);
}
const cwLocked = (x,y) => cw.given[y][x] || cw.ok[y][x];
function cwSay(txt,kind){const m=$('cwMsg'); m.textContent=txt; m.style.color = kind==='ok'?'var(--ok)':kind==='bad'?'var(--bad)':'var(--muted)'}
function cwFlash(x,y,cls){const d=cw.els[y][x]; d.classList.remove('flashok','flashbad'); void d.offsetWidth; d.classList.add(cls); setTimeout(()=>d.classList.remove(cls),450)}
function cwAdvance(){   // vai para a próxima casa ainda livre da palavra
  const w = cwActive(); if (!w) return;
  const i = w.cells.findIndex(([x,y])=>x===sel.x&&y===sel.y);
  for (let j=i+1;j<w.cells.length;j++){const [x,y]=w.cells[j]; if(!cwLocked(x,y)){sel.x=x;sel.y=y;return}}
}
function cwHintLabel(){
  const left = CW_MAX_HINTS-cwReveals, b = $('cwReveal');
  b.textContent = `💡 ${Math.max(0,left)}`; b.style.opacity = left<=0 ? .5 : 1;
}
function cwType(letter){
  if (!sel || cwDone) return;
  tCW.start();
  const {x,y} = sel;
  if (cwLocked(x,y)){cwAdvance(); cwPaint(); return}      // letra certa fica travada
  cw.user[y][x] = letter;
  if (letter===cw.ch[y][x]){
    cw.ok[y][x]=true; cw.bad[y][x]=false; cwSay('','');
    cwAdvance();
    const doneW = cwActive(); if (doneW && cwWordDone(doneW)) cwStep(1);   // palavra completa: vai para a próxima palavra que falta
    cwPaint(); cwFlash(x,y,'flashok'); cwCheckWin();
  } else {
    cw.bad[y][x]=true; cwSay('✘ Letra errada, tente outra','bad');
    cwPaint(); cwFlash(x,y,'flashbad');
  }
}
function cwBack(){
  if (!sel || cwDone) return;
  const w = cwActive(); if (!w) return;
  const {x,y} = sel;
  if (!cwLocked(x,y) && cw.user[y][x]){cw.user[y][x]='';cw.bad[y][x]=false;cwSay('','');cwPaint();return}
  const i = w.cells.findIndex(([a,b])=>a===x&&b===y);
  for (let j=i-1;j>=0;j--){
    const [a,b] = w.cells[j];
    if (!cwLocked(a,b)){sel.x=a;sel.y=b;cw.user[b][a]='';cw.bad[b][a]=false;break}
  }
  cwSay('',''); cwPaint();
}
function cwCheckWin(){
  for (let y=0;y<cw.H;y++) for (let x=0;x<cw.W;x++) if (cw.ch[y][x] && cw.user[y][x]!==cw.ch[y][x]) return;
  cwDone = true; tCW.pause(); cwSave(); const el = tCW.sec();
  const prev = +store(cwBest()) || 0; let rec = false;
  if (!prev || el<prev){store(cwBest(),String(el));rec=true}
  cwShowBest();
  showWin(`Tempo: <b>${fmt(el)}</b> · Revelações: <b>${cwReveals}</b>`, rec, prev);
}
$('cwReveal').onclick = ()=>{
  if (!sel || cwDone) return;
  if (cwReveals>=CW_MAX_HINTS){cwSay('Você já usou as 3 dicas desta fase','bad');return}
  const {x,y} = sel;
  if (cwLocked(x,y)){cwSay('Essa letra já está certa. Escolha uma casa vazia ou errada','muted');return}
  tCW.start();
  cw.user[y][x]=cw.ch[y][x]; cw.given[y][x]=true; cw.bad[y][x]=false; cwReveals++;
  cwSay(`💡 Letra revelada (restam ${CW_MAX_HINTS-cwReveals})`,'muted');
  cwAdvance(); cwPaint(); cwFlash(x,y,'flashok'); cwCheckWin();
};
$('cwPrev').onclick = ()=>cwStep(-1);
$('cwNext').onclick = ()=>cwStep(1);
function newCW(){
  tCW.reset(); cwDone=false; cwReveals=0; sel=null; $('cwMsg').textContent='';
  cw = gameMode==='arcade' ? arcGen('cw') : gameMode==='aleatorio' ? aleGen('cw') : generateCW();
  if (!cw){ $('cwClueTxt').textContent='Não consegui gerar. Toque em Novo jogo.'; $('cwBoard').innerHTML=''; return }
  cwShowBest(); cwRender();
  // seleciona a primeira palavra
  const f = cw.across[0] || cw.down[0]; if (f){sel={x:f.cells[0][0],y:f.cells[0][1],dir:f.dir}; cwPaint()}
  cwSave();
}

/* teclado na tela e físico */
(function(){
  const kb = $('kb');
  const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  rows.forEach((r,ri)=>{
    const d = document.createElement('div'); d.className='krow';
    r.split('').forEach(l=>{const b=document.createElement('button');b.className='key';b.textContent=l;
      b.addEventListener('pointerdown',e=>e.preventDefault());
      b.dataset.l=l; b.onclick=()=>keyPress(l);d.appendChild(b)});
    if (ri===2){const b=document.createElement('button');b.className='key wide';b.textContent='⌫';b.setAttribute('aria-label','Apagar');
      b.addEventListener('pointerdown',e=>e.preventDefault());
      b.onclick=()=>{ if (gameKey!=='fo') cwBack() };d.appendChild(b)}
    kb.appendChild(d);
  });
})();
document.addEventListener('keydown',e=>{
  if (gameKey!=='cw' || !cw || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key==='Backspace'){e.preventDefault();cwBack();return}
  if (e.key==='Tab'){e.preventDefault();cwStep(e.shiftKey?-1:1);return}
  const arrows = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if (arrows[e.key] && sel){
    e.preventDefault(); const [dx,dy]=arrows[e.key]; const nx=sel.x+dx, ny=sel.y+dy;
    if (nx>=0&&ny>=0&&nx<cw.W&&ny<cw.H&&cw.ch[ny][nx]){
      const dir = dx?0:1; sel = {x:nx,y:ny,dir:(dir===0?cw.cA:cw.cD)[ny][nx]?dir:1-dir}; cwPaint();
    }
    return;
  }
  const ch = e.key.length===1 ? e.key.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase() : '';
  if (/^[A-Z]$/.test(ch)){e.preventDefault();cwType(ch)}
});

/* =====================================================================
   Salvamento da partida em andamento (localStorage)
   ===================================================================== */
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
const elapsedMs = t => t.acc + (t.run ? Date.now()-t.t0 : 0);
/* Um salvamento independente por jogo e por dificuldade */
const slotKey = (g,d) => 'jp_'+(gameMode==='arcade'?'arc_':'')+g+'_save_'+d;
/* no Arcade, cada conjunto tem o seu salvamento; sem conjunto em jogo não há salvamento */
const saveId = d => gameMode!=='arcade' ? d : (arc.playing ? d+'_'+arcKey() : null);
function wsPct(){return ws && ws.placed && ws.placed.length ? Math.round(100*wsFound.size/ws.placed.length) : 0}
function wsActive(){return !!(ws && ws.grid && !wsDone && (wsFound.size>0 || wsHints>0))}
function cwStat(){
  if (!cw || !cw.ch) return {pct:0,active:false};
  let letters=0, given=0, ok=0, bad=0;
  for (let y=0;y<cw.H;y++) for (let x=0;x<cw.W;x++){
    if (!cw.ch[y][x]) continue; letters++;
    if (cw.given[y][x]) given++; else if (cw.ok[y][x]) ok++; else if (cw.bad[y][x]) bad++;
  }
  const init = given - cwReveals, den = Math.max(1, letters - init), num = ok + cwReveals;
  return {pct:Math.min(100,Math.round(100*num/den)), active: !cwDone && (num>0 || bad>0)};
}
function wsSave(){
  if (!ws || !ws.grid) return;
  const id = saveId(wsDiff); if (!id) return;
  if (wsDone){drop(slotKey('ws',id));return}
  store(slotKey('ws',id), JSON.stringify({diff:wsDiff,theme:wsTheme,grid:ws.grid,placed:ws.placed,n:ws.n,
    found:[...wsFound],hints:wsHints,acc:elapsedMs(tWS),pct:wsPct()}));
}
function wsLoad(diff){
  try{
    const id = saveId(diff||wsDiff); if (!id) return false;
    const raw = store(slotKey('ws',id)); if (!raw) return false;
    const d = JSON.parse(raw);
    if (!(d.diff in DIFFS) || !(d.theme in THEMES || d.theme==='__arc') || !Array.isArray(d.grid) || d.grid.length!==d.n ||
        !Array.isArray(d.placed) || !d.placed.length || !Array.isArray(d.found) || d.found.length>=d.placed.length) return false;
    wsDiff=d.diff; wsTheme=d.theme; if (gameMode!=='arcade') store('jp_ws_theme',wsTheme); tWS.reset();
    ws = {grid:d.grid, placed:d.placed, n:d.n}; wsFound = new Set(d.found); wsHints = d.hints|0; wsDone = false;
    tWS.acc = d.acc|0; tWS.draw(); wsShowBest(); wsRender(); return true;
  }catch(e){return false}
}
function cwSave(){
  if (!cw || !cw.placed) return;
  const id = saveId(cwDiff); if (!id) return;
  if (cwDone){drop(slotKey('cw',id));return}
  store(slotKey('cw',id), JSON.stringify({diff:cwDiff,theme:cwTheme,W:cw.W,H:cw.H,
    placed:cw.placed.map(p=>({word:p.word,clue:p.clue,x:p.x,y:p.y,dir:p.dir})),
    user:cw.user,given:cw.given,bad:cw.bad,ok:cw.ok,reveals:cwReveals,sel,acc:elapsedMs(tCW),pct:cwStat().pct}));
}
function cwLoad(diff){
  try{
    const id = saveId(diff||cwDiff); if (!id) return false;
    const raw = store(slotKey('cw',id)); if (!raw) return false;
    const d = JSON.parse(raw);
    if (!(d.diff in DIFFS) || !(d.theme in THEMES || d.theme==='__arc') || !Array.isArray(d.placed) || !d.placed.length ||
        !Array.isArray(d.user) || d.user.length!==d.H || !Array.isArray(d.given) || !Array.isArray(d.bad)) return false;
    cwDiff=d.diff; cwTheme=d.theme; if (gameMode!=='arcade') store('jp_cw_theme',cwTheme); tCW.reset();
    const m = cwModel({placed:d.placed.map(p=>({...p})),x0:0,y0:0,W:d.W,H:d.H});
    m.user=d.user; m.given=d.given; m.bad=d.bad;
    m.ok = Array.isArray(d.ok) ? d.ok : m.ch.map((r,y)=>r.map((c,x)=>!!(c && d.user[y][x]===c && !d.given[y][x])));
    cw = m; cwDone = false; cwReveals = d.reveals|0;
    tCW.acc = d.acc|0; tCW.draw();
    const f = cw.across[0] || cw.down[0];
    sel = (d.sel && d.sel.x<cw.W && d.sel.y<cw.H && cw.ch[d.sel.y][d.sel.x]) ? d.sel : (f?{x:f.cells[0][0],y:f.cells[0][1],dir:f.dir}:null);
    $('cwMsg').textContent=''; cwShowBest(); cwRender(); return true;
  }catch(e){return false}
}
setInterval(()=>{wsSave();cwSave()},5000);
window.addEventListener('pagehide',()=>{wsSave();cwSave()});

/* =====================================================================
   Interface comum
   ===================================================================== */
function showWin(line1, rec, prev){
  $('winTitle').textContent = '🎉 Parabéns!';
  $('res1').innerHTML = (gameMode==='arcade' ? '<b>'+curArcLabel()+'</b><br>' : '') + line1;
  const ultimo = gameKey==='fo' ? (foCur && foCur.gi===9) : arc.gi===9;
  $('again').textContent = gameMode==='arcade' ? (ultimo ? 'Ver conjuntos ▶' : (gameKey==='fo' ? 'Próxima palavra ▶' : 'Próximo jogo ▶')) : 'Jogar de novo';
  $('res2').innerHTML = rec===null ? '' : rec ? '<b>🏆 Novo recorde!</b>' : `Seu recorde: <b>${fmt(prev)}</b>`;
  setTimeout(()=>$('overlay').classList.add('show'), 350);
}
function hideWin(){$('overlay').classList.remove('show')}
/* pop-up de confirmação */
let cfAction = null;
function askNew(msg, action){
  $('cfMsg').textContent = msg; cfAction = action; $('confirm').classList.add('show');
}
$('cfYes').onclick = ()=>{ $('confirm').classList.remove('show'); const a=cfAction; cfAction=null; a&&a() };
$('cfNo').onclick = ()=>{ $('confirm').classList.remove('show'); cfAction=null; buildControls('ws'); buildControls('cw') };
const isActive = g => g==='ws' ? wsActive() : g==='cw' ? cwStat().active : !!(fo && !fo.done && fo.guessed.length>0);
const gTimer = g => g==='ws' ? tWS : g==='cw' ? tCW : tFO;
const gDone  = g => g==='ws' ? wsDone : g==='cw' ? cwDone : !!(fo && fo.done);
const gSave  = g => g==='ws' ? wsSave() : g==='cw' ? cwSave() : foSave();
const gLoad  = (g,k) => g==='ws' ? wsLoad(k) : g==='cw' ? cwLoad(k) : foLoad(k);
const gD = g => g==='ws'?wsDiff : g==='cw'?cwDiff : foDiff;
const gT = g => g==='ws'?wsTheme : g==='cw'?cwTheme : foTheme;
const gSetD = (g,v) => { if (g==='ws') wsDiff=v; else if (g==='cw') cwDiff=v; else foDiff=v };
const gSetT = (g,v) => { if (g==='ws') wsTheme=v; else if (g==='cw') cwTheme=v; else foTheme=v };
function startNew(g){ hideWin(); g==='ws' ? newWS() : g==='cw' ? newCW() : newFO() }
function buildControls(g){
  const dsel = $(g+'Diff'), sel = $(g+'Theme');
  if (!dsel.options.length){
    for (const k in DIFFS){const o=document.createElement('option');o.value=k;o.textContent='Dificuldade: '+DIFFS[k].nome;dsel.appendChild(o)}
    dsel.onchange = () => {
      const k = dsel.value;
      if (k===gD(g)) { dsel.value = gD(g); return }
      gSave(g);                              // guarda o jogo da dificuldade atual
      gSetD(g,k); store('jp_'+g+'_diff',k); hideWin();
      if (!gLoad(g,k)) startNew(g);          // retoma o salvo ou cria um novo
      buildControls(g);
    };
  }
  dsel.value = gD(g);
  if (!sel.options.length){
    // temas sempre em ordem alfabética pelo nome
    Object.keys(THEMES).sort((a,b)=>THEMES[a].nome.localeCompare(THEMES[b].nome,'pt-BR')).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent='Tema: '+THEMES[k].nome;sel.appendChild(o)});
    sel.onchange = () => {
      const v = sel.value;
      const go = () => { gSetT(g,v); store('jp_'+g+'_theme',v); startNew(g) };
      if (isActive(g)) askNew('Mudar o tema inicia um novo jogo nesta dificuldade e o progresso atual será perdido. Continuar?', go);
      else go();
    };
  }
  sel.value = gT(g);
}
function setGame(g){
  gTimer(gameKey).pause();
  gameKey = g; store('jp_game',g);
  $('wsPanel').classList.toggle('on', g==='ws');
  $('cwPanel').classList.toggle('on', g==='cw');
  $('foPanel').classList.toggle('on', g==='fo');
  document.body.classList.toggle("mode-cw", g!=="ws");
  const t = gTimer(g), done = gDone(g);
  if (t.began && !done) t.start();
  applyModeUI();
}
let onHome = true;
function goHome(){
  tWS.pause(); tCW.pause(); tFO.pause(); wsSave(); cwSave(); foSave(); onHome = true;
  document.body.classList.add('home'); document.body.classList.remove('mode-cw'); window.scrollTo(0,0);
  homeView('games');
}
function openGame(g){
  onHome = false; document.body.classList.remove('home'); setGame(g);
  try{history.pushState({g:1},'')}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll('#homeGames .homeBtn').forEach(b=>b.onclick=()=>{ homeG = b.dataset.g; homeView('modes') });
document.querySelectorAll('#homeModes [data-m]').forEach(b=>b.onclick=()=>{
  const m = b.dataset.m;
  if (m==='arcade'){ setMode('arcade'); if (homeG==='fo') foScope = 'all'; else arcUse(homeG); homeView('arcade'); return }
  setMode(m);
  if (m==='aleatorio') randomStart(homeG);
  openGame(homeG);
});
$('modeBack').onclick = ()=>homeView('games');
$('arcBack').onclick = ()=>homeView('modes');

$('homeBtn').onclick = ()=>{ if (history.state && history.state.g) history.back(); else goHome(); };
window.addEventListener('popstate',()=>{ if (!onHome) goHome(); });
$('topNew').onclick = ()=>{ const g = gameKey, novo = ()=> gameMode==='aleatorio' ? randomStart(g) : startNew(g);
  if (isActive(g)) askNew('Iniciar um novo jogo? O progresso atual será perdido.', novo); else novo() };
$('again').onclick = ()=>{ if (gameMode==='arcade') return gameKey==='fo' ? foArcNext() : arcNext(); startNew(gameKey) };
document.addEventListener('visibilitychange',()=>{
  const t = gTimer(gameKey), done = gDone(gameKey);
  if (document.hidden){wsSave();cwSave();foSave()}
  if (document.hidden) t.pause(); else if (t.began && !done && !onHome) t.start();
});
let rz; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ws&&ws.grid)wsRender();if(cw&&cw.els)cwRender()},150)});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
/* migra salvamentos do formato antigo (um único slot) */
['ws','cw'].forEach(g=>{ try{
  const raw = store('jp_'+g+'_save'); if (!raw) return;
  const d = JSON.parse(raw); if (d && d.diff in DIFFS && !store(slotKey(g,d.diff))) store(slotKey(g,d.diff), raw);
  drop('jp_'+g+'_save');
}catch(e){} });
if (gameMode==='arcade') arcApply();
else { wsLoad() || newWS(); cwLoad() || newCW(); foLoad() || newFO(); }
buildControls("ws"); buildControls("cw"); buildControls("fo"); applyModeUI(); setGame(gameKey); goHome();
</script>
